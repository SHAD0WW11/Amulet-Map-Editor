
name: Install Amulet Map Editor

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  install:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgstreamer-plugins-base1.0-dev \
            libsdl2-2.0-0 \
            libsdl2-image-2.0-0 \
            libsdl2-mixer-2.0-0 \
            libsm6 \
            libnotify-dev \
            libxtst-dev

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install CMake 4.1+
        run: |
          python -m pip install "cmake>=4.1"

      - name: Install wxPython (GTK3)
        run: |
          python -m pip install --upgrade \
            --find-links https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04 \
            wxPython

      - name: Install Amulet Map Editor
        run: |
          python -m pip install --upgrade \
            --upgrade-strategy eager \
            amulet-map-editor==0.10.66

      - name: Verify installation
        run: |
          python --version
          cmake --version
          python -c "import wx; print('wxPython:', wx.version())"
          python -m pip show amulet-map-editor
