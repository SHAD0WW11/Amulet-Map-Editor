name: Build Windows

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: windows-2025, python-version: '3.11', architecture: x64 }
          - { os: windows-11-arm, python-version: '3.11', architecture: arm64 }

    runs-on: ${{ matrix.cfg.os }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Clone
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.cfg.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.cfg.python-version }}
        architecture: ${{ matrix.cfg.architecture }}

    - name: Setup MSVC
      if: matrix.cfg.os == 'windows-11-arm'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: arm64

    - name: Install dependencies
      run: |
        pip install twine pyinstaller~=6.18 build

    - name: Build Wheels
      shell: pwsh
      env:
        BDISTWHEELFREEZELIBS: 'true'
        CFLAGS: ${{ matrix.cfg.os == 'windows-11-arm' && '-D__builtin_isnan=isnan -D__builtin_isinf=isinf -D__builtin_isfinite=isfinite' || '' }}
      run: |
        python -m build
        
    - name: Install Wheels
      run: |
        python -m pip install dist/amulet_map_editor-*.whl --upgrade

    - name: PyInstaller build
      run: |
        python -m PyInstaller -y --distpath ./installer/dist installer/Amulet.spec

    - name: Windows - Install NSIS
      uses: repolevedavaj/install-nsis@v1.2.0
      with:
        nsis-version: '3.11'

    - name: Windows - Create Installer (Unsigned)
      shell: bash
      run: |
        makensis -DVERSION=${{ github.event.release.tag_name || github.run_number }} -DARCH=${{ matrix.cfg.architecture }} installer/windows.nsi
        rm -rf installer/dist/amulet

    - name: Upload Release Asset
      uses: actions/upload-artifact@v6
      with:
        name: Amulet-${{ github.event.release.tag_name }}-${{ runner.os }}-${{ matrix.cfg.architecture }}
        path: ./installer/dist
